<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator ID Card Siswa SMK Muhammadiyah 2 Muntilan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dimensi Kartu A4 Lanscape ID Card (Dicetak di kertas Portrait) */
            --card-w: 85mm;
            --card-h: 55mm;

            /* Background */
            --bg-rot: 0deg;
            --bg-scale: 1;

            /* Foto */
            --foto-x: 5mm;
            --foto-y: 10mm;
            --foto-w: 22mm;
            --foto-h: 33mm;
            --foto-rot: 0deg;

            /* Nama Siswa */
            --nama-x: 30mm;
            --nama-y: 15mm;
            --nama-w: 50mm;
            --nama-size: 12pt;
            --nama-rot: 0deg;
            --nama-color: #000000;
            --nama-bg: none;
            --nama-bg-clip: border-box;
            --nama-fill: var(--nama-color);
            --nama-c1: #ff0000;
            --nama-c2: #0000ff;
            --nama-grad-angle: 90deg;

            /* Jurusan */
            --jur-x: 30mm;
            --jur-y: 30mm;
            --jur-w: 50mm;
            --jur-size: 9pt;
            --jur-rot: 0deg;
            --jur-color: #1a4b82;
            --jur-bg: none;
            --jur-bg-clip: border-box;
            --jur-fill: var(--jur-color);
            --jur-c1: #00ff00;
            --jur-c2: #0000ff;
            --jur-grad-angle: 90deg;
        }

        @page {
            size: A4 portrait;
            margin: 0;
        }

        body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }

        /* Komponen Kartu */
        .card {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            border: 1px dashed #cbd5e1;
            box-sizing: border-box;
            page-break-inside: avoid;
            break-inside: avoid;
        }

        .card-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100%;
            height: 100%;
            /* Translasi untuk center, lalu rotasi, lalu scale */
            transform: translate(-50%, -50%) rotate(var(--bg-rot)) scale(var(--bg-scale));
            object-fit: cover;
            z-index: 1;
        }

        .card-foto {
            position: absolute;
            left: var(--foto-x);
            top: var(--foto-y);
            width: var(--foto-w);
            height: var(--foto-h);
            transform: rotate(var(--foto-rot));
            transform-origin: top left;
            object-fit: cover;
            z-index: 10;
            background-color: #e2e8f0;
        }

        .card-nama {
            position: absolute;
            left: var(--nama-x);
            top: var(--nama-y);
            width: var(--nama-w);
            font-size: var(--nama-size);
            transform: rotate(var(--nama-rot));
            transform-origin: top left;
            font-weight: 700;
            text-align: center;
            z-index: 20;
            font-family: Arial, sans-serif;
            line-height: 1.2;
            
            /* Logic Warna / Gradasi */
            color: var(--nama-color);
            background: var(--nama-bg);
            -webkit-background-clip: var(--nama-bg-clip);
            background-clip: var(--nama-bg-clip);
            -webkit-text-fill-color: var(--nama-fill);
        }

        .card-jurusan {
            position: absolute;
            left: var(--jur-x);
            top: var(--jur-y);
            width: var(--jur-w);
            font-size: var(--jur-size);
            transform: rotate(var(--jur-rot));
            transform-origin: top left;
            font-weight: 700;
            text-align: center;
            z-index: 20;
            font-family: Arial, sans-serif;
            line-height: 1.2;
            
            /* Logic Warna / Gradasi */
            color: var(--jur-color);
            background: var(--jur-bg);
            -webkit-background-clip: var(--jur-bg-clip);
            background-clip: var(--jur-bg-clip);
            -webkit-text-fill-color: var(--jur-fill);
        }

        /* Layouting Print Area (Strict A4 Page) */
        .a4-page {
            width: 210mm;
            height: 297mm;
            display: grid;
            grid-template-columns: repeat(2, var(--card-w));
            grid-template-rows: repeat(5, var(--card-h));
            gap: 2mm;
            justify-content: center;
            align-content: center;
            margin: 0 auto 20px auto;
            page-break-after: always;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }

        /* Menyembunyikan elemen UI saat dicetak */
        @media print {
            body, html { margin: 0; padding: 0; background: white; }
            .no-print { display: none !important; }
            .card { border: 1px solid transparent; } /* Hilangkan dashed border saat cetak */
            #printWrapper { padding: 0; overflow: visible; }
            #printArea {
                padding: 0;
                margin: 0;
                width: 100%;
                gap: 0;
            }
            .a4-page { 
                margin: 0; 
                box-shadow: none; 
                gap: 0; 
                align-content: start;
                padding-top: 10mm; /* Jarak aman tepi atas printer */
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="bg-blue-900 text-white shadow p-4 no-print flex justify-between items-center z-20">
        <div>
            <h1 class="text-xl font-bold">SMK MUHAMMADIYAH 2 MUNTILAN</h1>
            <p class="text-sm text-blue-200">ID Card Generator - Pro Edition</p>
        </div>
        <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow transition flex items-center gap-2">
            🖨️ Cetak A4 (10 Kartu/Hal)
        </button>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex overflow-hidden no-print">
        
        <!-- LEFT SIDEBAR: Controls (Scrollable) -->
        <aside class="w-1/3 min-w-[350px] bg-white border-r shadow-lg overflow-y-auto p-5 space-y-6 z-10">
            
            <!-- 1. Uploads -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">1. Data & File</h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Template (Background)</label>
                        <input type="file" id="templateInput" accept="image/*" class="w-full text-xs border rounded p-1.5 bg-white">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Data Siswa (.xlsx)</label>
                        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="w-full text-xs border rounded p-1.5 bg-white">
                        <p class="text-[10px] text-slate-500 mt-1">Kolom wajib: No, Nama, Kelas, Foto</p>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">Upload Foto-foto Siswa</label>
                        <input type="file" id="photosInput" accept="image/*" multiple class="w-full text-xs border rounded p-1.5 bg-white">
                    </div>
                    <button onclick="generateCards()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded shadow transition text-sm">
                        ⚙️ Generate Semua Data
                    </button>
                    <div id="statusInfo" class="hidden text-xs p-2 rounded bg-green-100 text-green-800 text-center font-medium"></div>
                </div>
            </div>

            <!-- 2. Kalibrasi Background -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">🖼️ Background</h2>
                <div class="space-y-2 text-xs">
                    <label class="block">Rotasi: <span id="v-bg-rot">0</span>°
                        <input type="range" min="-180" max="180" value="0" step="90" oninput="updateVar('--bg-rot', this.value+'deg', 'v-bg-rot')" class="w-full"></label>
                    <label class="block">Skala (Zoom): <span id="v-bg-scale">1</span>
                        <input type="range" min="0.5" max="3" value="1" step="0.1" oninput="updateVar('--bg-scale', this.value, 'v-bg-scale')" class="w-full"></label>
                </div>
            </div>

            <!-- 3. Kalibrasi Foto -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">📸 Foto Siswa</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-foto-x">5</span>
                        <input type="range" min="-50" max="150" value="5" step="0.5" oninput="updateVar('--foto-x', this.value+'mm', 'v-foto-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-foto-y">10</span>
                        <input type="range" min="-50" max="150" value="10" step="0.5" oninput="updateVar('--foto-y', this.value+'mm', 'v-foto-y')" class="w-full"></label>
                    <label>Lebar: <span id="v-foto-w">22</span>
                        <input type="range" min="10" max="85" value="22" step="0.5" oninput="updateVar('--foto-w', this.value+'mm', 'v-foto-w')" class="w-full"></label>
                    <label>Tinggi: <span id="v-foto-h">33</span>
                        <input type="range" min="10" max="100" value="33" step="0.5" oninput="updateVar('--foto-h', this.value+'mm', 'v-foto-h')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi (0-360°): <span id="v-foto-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--foto-rot', this.value+'deg', 'v-foto-rot')" class="w-full"></label>
                </div>
            </div>

            <!-- 4. Kalibrasi Nama -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">✍️ Teks Nama</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-nama-x">30</span>
                        <input type="range" min="-50" max="150" value="30" step="0.5" oninput="updateVar('--nama-x', this.value+'mm', 'v-nama-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-nama-y">15</span>
                        <input type="range" min="-50" max="150" value="15" step="0.5" oninput="updateVar('--nama-y', this.value+'mm', 'v-nama-y')" class="w-full"></label>
                    <label>Lebar Teks: <span id="v-nama-w">50</span>
                        <input type="range" min="20" max="150" value="50" step="1" oninput="updateVar('--nama-w', this.value+'mm', 'v-nama-w')" class="w-full"></label>
                    <label>Ukuran Font: <span id="v-nama-size">12</span>
                        <input type="range" min="6" max="48" value="12" step="0.5" oninput="updateVar('--nama-size', this.value+'pt', 'v-nama-size')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi (0-360°): <span id="v-nama-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--nama-rot', this.value+'deg', 'v-nama-rot')" class="w-full"></label>
                    
                    <div class="col-span-2 border-t pt-2 mt-1">
                        <label class="flex items-center gap-2 mb-2 font-semibold">
                            <input type="color" id="nama-color" value="#000000" oninput="updateVar('--nama-color', this.value); toggleGrad('nama');" class="w-6 h-6 p-0 border-0 rounded cursor-pointer">
                            Warna Solid
                        </label>
                        <label class="flex items-center gap-2 text-blue-700 font-semibold mb-1">
                            <input type="checkbox" id="nama-grad-cb" onchange="toggleGrad('nama')" class="cursor-pointer">
                            Aktifkan Warna Gradasi
                        </label>
                        <div class="flex flex-col gap-2">
                            <div class="flex gap-2">
                                <input type="color" id="nama-c1" value="#ff0000" oninput="updateVar('--nama-c1', this.value); toggleGrad('nama');" class="w-full h-6 cursor-pointer">
                                <input type="color" id="nama-c2" value="#0000ff" oninput="updateVar('--nama-c2', this.value); toggleGrad('nama');" class="w-full h-6 cursor-pointer">
                            </div>
                            <label class="mt-1">Sudut Gradasi: <span id="v-nama-grad-angle">90</span>°
                                <input type="range" min="0" max="360" value="90" step="1" oninput="updateVar('--nama-grad-angle', this.value+'deg', 'v-nama-grad-angle'); toggleGrad('nama');" class="w-full"></label>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 5. Kalibrasi Jurusan -->
            <div class="bg-slate-50 p-4 rounded-xl border mb-10">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">🎓 Teks Jurusan</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-jur-x">30</span>
                        <input type="range" min="-50" max="150" value="30" step="0.5" oninput="updateVar('--jur-x', this.value+'mm', 'v-jur-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-jur-y">30</span>
                        <input type="range" min="-50" max="150" value="30" step="0.5" oninput="updateVar('--jur-y', this.value+'mm', 'v-jur-y')" class="w-full"></label>
                    <label>Lebar Teks: <span id="v-jur-w">50</span>
                        <input type="range" min="20" max="150" value="50" step="1" oninput="updateVar('--jur-w', this.value+'mm', 'v-jur-w')" class="w-full"></label>
                    <label>Ukuran Font: <span id="v-jur-size">9</span>
                        <input type="range" min="5" max="36" value="9" step="0.5" oninput="updateVar('--jur-size', this.value+'pt', 'v-jur-size')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi (0-360°): <span id="v-jur-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--jur-rot', this.value+'deg', 'v-jur-rot')" class="w-full"></label>
                    
                    <div class="col-span-2 border-t pt-2 mt-1">
                        <label class="flex items-center gap-2 mb-2 font-semibold">
                            <input type="color" id="jur-color" value="#1a4b82" oninput="updateVar('--jur-color', this.value); toggleGrad('jur');" class="w-6 h-6 p-0 border-0 rounded cursor-pointer">
                            Warna Solid
                        </label>
                        <label class="flex items-center gap-2 text-blue-700 font-semibold mb-1">
                            <input type="checkbox" id="jur-grad-cb" onchange="toggleGrad('jur')" class="cursor-pointer">
                            Aktifkan Warna Gradasi
                        </label>
                        <div class="flex flex-col gap-2">
                            <div class="flex gap-2">
                                <input type="color" id="jur-c1" value="#00ff00" oninput="updateVar('--jur-c1', this.value); toggleGrad('jur');" class="w-full h-6 cursor-pointer">
                                <input type="color" id="jur-c2" value="#0000ff" oninput="updateVar('--jur-c2', this.value); toggleGrad('jur');" class="w-full h-6 cursor-pointer">
                            </div>
                            <label class="mt-1">Sudut Gradasi: <span id="v-jur-grad-angle">90</span>°
                                <input type="range" min="0" max="360" value="90" step="1" oninput="updateVar('--jur-grad-angle', this.value+'deg', 'v-jur-grad-angle'); toggleGrad('jur');" class="w-full"></label>
                        </div>
                    </div>
                </div>
            </div>

        </aside>

        <!-- RIGHT SIDE: Preview / Print Area -->
        <section class="w-2/3 flex-1 bg-slate-200 overflow-y-auto p-8 relative" id="printWrapper">
            <h2 class="text-xl font-bold text-slate-500 mb-4 no-print text-center">Live Preview / Area Cetak</h2>
            
            <div id="printArea" class="flex flex-col items-center gap-8">
                <!-- Preview 1 Card Default -->
                <div class="a4-page shadow-xl no-print">
                    <div class="card">
                        <img id="previewBg" src="https://placehold.co/850x550/e2e8f0/64748b?text=Upload+Template+Disini" class="card-bg">
                        <img src="https://placehold.co/220x330/cbd5e1/475569?text=FOTO" class="card-foto">
                        <div class="card-nama">ADITYA PUTRA PREVIEW</div>
                        <div class="card-jurusan">MANAJEMEN PERKANTORAN DAN LAYANAN BISNIS</div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        let customTemplateUrl = '';
        let photoMap = {};

        // 1. UPDATE CSS VARIABEL & LABEL
        function updateVar(varName, value, labelId) {
            document.documentElement.style.setProperty(varName, value);
            if (labelId) document.getElementById(labelId).innerText = parseFloat(value);
        }

        // 2. TOGGLE GRADIENT LOGIC
        function toggleGrad(prefix) {
            const isChecked = document.getElementById(prefix + '-grad-cb').checked;
            if (isChecked) {
                // Terapkan Gradient dengan angle rotasi
                updateVar(`--${prefix}-bg`, `linear-gradient(var(--${prefix}-grad-angle), var(--${prefix}-c1), var(--${prefix}-c2))`);
                updateVar(`--${prefix}-bg-clip`, 'text');
                updateVar(`--${prefix}-fill`, 'transparent');
            } else {
                // Kembalikan ke Warna Solid
                updateVar(`--${prefix}-bg`, 'none');
                updateVar(`--${prefix}-bg-clip`, 'border-box');
                updateVar(`--${prefix}-fill`, `var(--${prefix}-color)`);
            }
        }

        // 3. HANDLE UPLOAD BACKGROUND
        document.getElementById('templateInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customTemplateUrl = evt.target.result;
                    // Update preview dummy
                    const prevBg = document.getElementById('previewBg');
                    if(prevBg) prevBg.src = customTemplateUrl;
                };
                reader.readAsDataURL(file);
            }
        });

        // 4. TRANSLASI JURUSAN
        function getFullJurusan(code) {
            if (!code) return '';
            const c = code.toString().trim().toUpperCase();
            if (c === 'TJKT') return 'TEKNIK JARINGAN KOMPUTER DAN TELEKOMUNIKASI';
            if (c === 'MPLB') return 'MANAJEMEN PERKANTORAN DAN LAYANAN BISNIS';
            if (c === 'AKL') return 'AKUNTANSI DAN KEUANGAN LEMBAGA';
            return code.toUpperCase();
        }

        function setStatus(msg) {
            const info = document.getElementById('statusInfo');
            info.innerText = msg;
            info.classList.remove('hidden');
        }

        // 5. GENERATE CARDS DARI EXCEL
        function generateCards() {
            const excelFile = document.getElementById('excelInput').files[0];
            const photos = document.getElementById('photosInput').files;
            const printArea = document.getElementById('printArea');
            
            if (!excelFile) {
                alert("Harap upload file Excel Data Siswa terlebih dahulu.");
                return;
            }

            setStatus("Memproses file excel dan foto...");

            // Mapping foto berdasarkan nama file
            photoMap = {};
            for (let i = 0; i < photos.length; i++) {
                photoMap[photos[i].name.toLowerCase()] = URL.createObjectURL(photos[i]);
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    if (rows.length === 0) throw new Error("Data Excel Kosong");

                    // Kosongkan area cetak
                    printArea.innerHTML = '';
                    
                    const CARDS_PER_PAGE = 10;
                    let currentPage = null;
                    let cardCount = 0;

                    rows.forEach((row, index) => {
                        // Buat kontainer halaman cetak A4 baru per 10 kartu (Pagination Otomatis)
                        if (cardCount % CARDS_PER_PAGE === 0) {
                            currentPage = document.createElement('div');
                            currentPage.className = 'a4-page shadow-xl'; // Memaksa format layout kertas A4
                            printArea.appendChild(currentPage);
                        }

                        // Deteksi kolom dinamis
                        const nama = row['Nama'] || row['nama'] || row['NAMA'] || '-';
                        const kelas = getFullJurusan(row['Kelas'] || row['kelas'] || row['KELAS'] || '');
                        const fotoKey = (row['Foto'] || row['foto'] || row['FOTO'] || '').toString().toLowerCase();
                        
                        const fotoSrc = photoMap[fotoKey] || 'https://placehold.co/220x330/cbd5e1/475569?text=FOTO+TIDAK+DITEMUKAN';
                        const bgSrc = customTemplateUrl || 'https://placehold.co/850x550/e2e8f0/64748b?text=Template+Default';

                        const cardHTML = `
                            <div class="card">
                                <img src="${bgSrc}" class="card-bg">
                                <img src="${fotoSrc}" class="card-foto">
                                <div class="card-nama">${nama}</div>
                                <div class="card-jurusan">${kelas}</div>
                            </div>
                        `;

                        currentPage.innerHTML += cardHTML;
                        cardCount++;
                    });

                    setStatus(`Berhasil! ${rows.length} kartu siap dicetak.`);
                } catch (err) {
                    console.error(err);
                    setStatus("Gagal memproses data. Pastikan format kolom excel benar.");
                }
            };
            reader.readAsArrayBuffer(excelFile);
        }

        // Jalankan toggleGrad awal untuk memastikan warna default ter-set dengan benar
        toggleGrad('nama');
        toggleGrad('jur');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator ID Card Siswa SMK Muhammadiyah 2 Muntilan</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Dimensi ID Card (Landscape) */
            --card-w: 85mm;
            --card-h: 55mm;

            /* Kalibrasi Foto */
            --foto-x: 5mm;
            --foto-y: 10mm;
            --foto-w: 22mm;
            --foto-h: 33mm;
            --foto-rot: 0deg;

            /* Kalibrasi Nama Siswa */
            --nama-x: 30mm;
            --nama-y: 20mm;
            --nama-w: 50mm;
            --nama-size: 12pt;
            --nama-rot: 0deg;
            --nama-color1: #000000;
            --nama-color2: #000000;
            --nama-grad-angle: 90deg;

            /* Kalibrasi Jurusan */
            --jur-x: 30mm;
            --jur-y: 35mm;
            --jur-w: 50mm;
            --jur-size: 8pt;
            --jur-rot: 0deg;
            --jur-color1: #1e3a8a;
            --jur-color2: #3b82f6;
            --jur-grad-angle: 90deg;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
        }

        /* --- STYLING KARTU --- */
        .card {
            width: var(--card-w);
            height: var(--card-h);
            position: relative;
            overflow: hidden;
            background-color: #ffffff;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
        }

        /* Template Background menggunakan tag <img> murni agar kebal terhadap printer */
        .card-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1; /* Paling belakang */
        }

        .card-foto {
            position: absolute;
            left: var(--foto-x);
            top: var(--foto-y);
            width: var(--foto-w);
            height: var(--foto-h);
            transform: rotate(var(--foto-rot));
            transform-origin: top left;
            object-fit: cover;
            z-index: 10;
            background-color: #e2e8f0;
        }

        .card-nama {
            position: absolute;
            left: var(--nama-x);
            top: var(--nama-y);
            width: var(--nama-w);
            font-size: var(--nama-size);
            transform: rotate(var(--nama-rot));
            transform-origin: top left;
            font-weight: 700;
            text-align: center;
            z-index: 20;
            line-height: 1.1;
            background: linear-gradient(var(--nama-grad-angle), var(--nama-color1), var(--nama-color2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        .card-jurusan {
            position: absolute;
            left: var(--jur-x);
            top: var(--jur-y);
            width: var(--jur-w);
            font-size: var(--jur-size);
            transform: rotate(var(--jur-rot));
            transform-origin: top left;
            font-weight: 700;
            text-align: center;
            z-index: 20;
            line-height: 1.1;
            background: linear-gradient(var(--jur-grad-angle), var(--jur-color1), var(--jur-color2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }

        /* --- STYLING HALAMAN A4 (PREVIEW & PRINT) --- */
        .a4-page {
            width: 210mm;
            height: 297mm;
            display: grid;
            grid-template-columns: repeat(2, var(--card-w));
            grid-template-rows: repeat(5, var(--card-h));
            gap: 5mm; /* Jarak antar kartu */
            justify-content: center;
            align-content: start;
            padding-top: 10mm; /* Margin atas untuk ruang print */
            margin: 0 auto 20px auto;
            background-color: white;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            box-sizing: border-box;
        }

        /* --- BULLETPROOF PRINT CSS --- */
        @media print {
            /* 1. Atur ukuran kertas secara ketat */
            @page {
                size: A4 portrait;
                margin: 0;
            }

            /* 2. Matikan Tailwind h-screen dan overflow-hidden yang memicu blank print */
            html, body {
                height: auto !important;
                overflow: visible !important;
                margin: 0 !important;
                padding: 0 !important;
                background-color: white !important;
                display: block !important; /* Timpa flex Tailwind */
            }

            #mainContainer, #printWrapper, #printArea {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
                padding: 0 !important;
                margin: 0 !important;
            }

            /* 3. Sembunyikan elemen antarmuka */
            .no-print { 
                display: none !important; 
            }

            /* 4. Format lembar A4 di kertas printer */
            .a4-page { 
                margin: 0 !important; 
                box-shadow: none !important;
                page-break-after: always !important; /* Pisah halaman dengan tegas */
                page-break-inside: avoid !important;
                border: none !important;
            }

            /* 5. Hilangkan garis bantu pada kartu saat di-print */
            .card { border: none !important; }

            /* 6. Paksa browser mencetak semua warna / gambar */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            
            /* Paksa efek gradasi teks tetap berjalan di mode cetak */
            .card-nama, .card-jurusan {
                -webkit-text-fill-color: transparent !important;
            }
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- HEADER (TIDAK DICETAK) -->
    <header class="bg-blue-900 text-white shadow-md p-4 no-print flex justify-between items-center z-20 shrink-0">
        <div>
            <h1 class="text-xl font-bold">SMK MUHAMMADIYAH 2 MUNTILAN</h1>
            <p class="text-sm text-blue-200">ID Card Generator (Fixed Print Engine)</p>
        </div>
        <button onclick="window.print()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow transition flex items-center gap-2">
            🖨️ Cetak A4
        </button>
    </header>

    <!-- MAIN CONTAINER -->
    <main id="mainContainer" class="flex-1 flex overflow-hidden">
        
        <!-- PANEL KONTROL KIRI (TIDAK DICETAK) -->
        <aside class="w-1/3 min-w-[350px] max-w-[400px] bg-white border-r shadow-lg overflow-y-auto p-5 space-y-6 z-10 no-print">
            
            <!-- 1. Upload Section -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">1. Data & File</h2>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Upload Template (.jpg/.png)</label>
                        <input type="file" id="templateInput" accept="image/*" class="w-full border rounded p-1.5 bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Upload Data Siswa (.xlsx)</label>
                        <input type="file" id="excelInput" accept=".xlsx, .xls, .csv" class="w-full border rounded p-1.5 bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-slate-600 mb-1">Upload Semua Foto Siswa</label>
                        <input type="file" id="photosInput" accept="image/*" multiple class="w-full border rounded p-1.5 bg-white">
                    </div>
                    <button onclick="generateCards()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded shadow transition">
                        ⚙️ Generate ID Card
                    </button>
                    <div id="statusInfo" class="hidden text-xs p-2 rounded bg-green-100 text-green-800 text-center font-medium"></div>
                </div>
            </div>

            <!-- 2. Kalibrasi Foto -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">📸 Kalibrasi Foto</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-foto-x">5</span>
                        <input type="range" min="0" max="85" value="5" step="0.5" oninput="updateVar('--foto-x', this.value+'mm', 'v-foto-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-foto-y">10</span>
                        <input type="range" min="0" max="55" value="10" step="0.5" oninput="updateVar('--foto-y', this.value+'mm', 'v-foto-y')" class="w-full"></label>
                    <label>Lebar: <span id="v-foto-w">22</span>
                        <input type="range" min="10" max="50" value="22" step="0.5" oninput="updateVar('--foto-w', this.value+'mm', 'v-foto-w')" class="w-full"></label>
                    <label>Tinggi: <span id="v-foto-h">33</span>
                        <input type="range" min="10" max="50" value="33" step="0.5" oninput="updateVar('--foto-h', this.value+'mm', 'v-foto-h')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi: <span id="v-foto-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--foto-rot', this.value+'deg', 'v-foto-rot')" class="w-full"></label>
                </div>
            </div>

            <!-- 3. Kalibrasi Nama -->
            <div class="bg-slate-50 p-4 rounded-xl border">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">✍️ Kalibrasi Nama Siswa</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-nama-x">30</span>
                        <input type="range" min="0" max="85" value="30" step="0.5" oninput="updateVar('--nama-x', this.value+'mm', 'v-nama-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-nama-y">20</span>
                        <input type="range" min="0" max="55" value="20" step="0.5" oninput="updateVar('--nama-y', this.value+'mm', 'v-nama-y')" class="w-full"></label>
                    <label>Lebar Kotak: <span id="v-nama-w">50</span>
                        <input type="range" min="10" max="85" value="50" step="1" oninput="updateVar('--nama-w', this.value+'mm', 'v-nama-w')" class="w-full"></label>
                    <label>Ukuran Font: <span id="v-nama-size">12</span>
                        <input type="range" min="6" max="24" value="12" step="0.5" oninput="updateVar('--nama-size', this.value+'pt', 'v-nama-size')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi: <span id="v-nama-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--nama-rot', this.value+'deg', 'v-nama-rot')" class="w-full"></label>
                    <label class="flex items-center gap-2">Warna 1:
                        <input type="color" value="#000000" oninput="updateVar('--nama-color1', this.value)" class="w-8 h-8 p-0 border-0"></label>
                    <label class="flex items-center gap-2">Warna 2:
                        <input type="color" value="#000000" oninput="updateVar('--nama-color2', this.value)" class="w-8 h-8 p-0 border-0"></label>
                    <label class="col-span-2 text-purple-600 font-bold">Arah Gradasi: <span id="v-nama-grad-angle">90</span>°
                        <input type="range" min="0" max="360" value="90" step="1" oninput="updateVar('--nama-grad-angle', this.value+'deg', 'v-nama-grad-angle')" class="w-full"></label>
                </div>
            </div>

            <!-- 4. Kalibrasi Jurusan -->
            <div class="bg-slate-50 p-4 rounded-xl border mb-10">
                <h2 class="font-bold border-b pb-2 mb-3 text-slate-800">🎓 Kalibrasi Teks Jurusan</h2>
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <label>Posisi Kiri (X): <span id="v-jur-x">30</span>
                        <input type="range" min="0" max="85" value="30" step="0.5" oninput="updateVar('--jur-x', this.value+'mm', 'v-jur-x')" class="w-full"></label>
                    <label>Posisi Atas (Y): <span id="v-jur-y">35</span>
                        <input type="range" min="0" max="55" value="35" step="0.5" oninput="updateVar('--jur-y', this.value+'mm', 'v-jur-y')" class="w-full"></label>
                    <label>Lebar Kotak: <span id="v-jur-w">50</span>
                        <input type="range" min="10" max="85" value="50" step="1" oninput="updateVar('--jur-w', this.value+'mm', 'v-jur-w')" class="w-full"></label>
                    <label>Ukuran Font: <span id="v-jur-size">8</span>
                        <input type="range" min="5" max="20" value="8" step="0.5" oninput="updateVar('--jur-size', this.value+'pt', 'v-jur-size')" class="w-full"></label>
                    <label class="col-span-2 text-emerald-600 font-bold">Rotasi: <span id="v-jur-rot">0</span>°
                        <input type="range" min="0" max="360" value="0" step="1" oninput="updateVar('--jur-rot', this.value+'deg', 'v-jur-rot')" class="w-full"></label>
                    <label class="flex items-center gap-2">Warna 1:
                        <input type="color" value="#1e3a8a" oninput="updateVar('--jur-color1', this.value)" class="w-8 h-8 p-0 border-0"></label>
                    <label class="flex items-center gap-2">Warna 2:
                        <input type="color" value="#3b82f6" oninput="updateVar('--jur-color2', this.value)" class="w-8 h-8 p-0 border-0"></label>
                    <label class="col-span-2 text-purple-600 font-bold">Arah Gradasi: <span id="v-jur-grad-angle">90</span>°
                        <input type="range" min="0" max="360" value="90" step="1" oninput="updateVar('--jur-grad-angle', this.value+'deg', 'v-jur-grad-angle')" class="w-full"></label>
                </div>
            </div>

        </aside>

        <!-- AREA KANAN: PREVIEW & PRINT -->
        <section id="printWrapper" class="flex-1 bg-slate-200 overflow-y-auto p-8 relative">
            <h2 class="text-xl font-bold text-slate-500 mb-4 no-print text-center">Live Preview / Area Cetak</h2>
            
            <div id="printArea" class="flex flex-col items-center gap-8">
                <!-- Preview Awal (Contoh) -->
                <div class="a4-page">
                    <div class="card">
                        <img id="previewBg" src="https://placehold.co/850x550/e2e8f0/64748b?text=Upload+Template+Disini" class="card-bg">
                        <img src="https://placehold.co/220x330/cbd5e1/475569?text=FOTO" class="card-foto">
                        <div class="card-nama">ADITYA PUTRA</div>
                        <div class="card-jurusan">MANAJEMEN PERKANTORAN DAN LAYANAN BISNIS</div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let customTemplateUrl = '';
        let photoMap = {};

        // Helper untuk CSS Variable
        function updateVar(varName, value, labelId) {
            document.documentElement.style.setProperty(varName, value);
            if (labelId) document.getElementById(labelId).innerText = parseFloat(value);
        }

        // 1. Upload Template
        document.getElementById('templateInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    customTemplateUrl = evt.target.result;
                    // Tampilkan di preview jika belum digenerate
                    const prevBg = document.getElementById('previewBg');
                    if(prevBg) prevBg.src = customTemplateUrl;
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. Translasi Singkatan Jurusan
        function translateJurusan(kode) {
            if (!kode) return '';
            const c = kode.toString().trim().toUpperCase();
            if (c === 'TJKT') return 'TEKNIK JARINGAN KOMPUTER DAN TELEKOMUNIKASI';
            if (c === 'MPLB') return 'MANAJEMEN PERKANTORAN DAN LAYANAN BISNIS';
            if (c === 'AKL') return 'AKUNTANSI DAN KEUANGAN LEMBAGA';
            return c; // Kembalikan string asli jika tidak ada singkatan yang cocok
        }

        function setStatus(msg) {
            const info = document.getElementById('statusInfo');
            info.innerText = msg;
            info.classList.remove('hidden');
        }

        // 3. Proses Generate Semua
        function generateCards() {
            const excelFile = document.getElementById('excelInput').files[0];
            const photos = document.getElementById('photosInput').files;
            const printArea = document.getElementById('printArea');
            
            if (!excelFile) {
                alert("Harap upload file Excel Data Siswa terlebih dahulu.");
                return;
            }

            setStatus("Memproses file...");

            // Petakan file foto ke dalam dictionary untuk pencarian cepat
            photoMap = {};
            for (let i = 0; i < photos.length; i++) {
                photoMap[photos[i].name.toLowerCase()] = URL.createObjectURL(photos[i]);
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheet = workbook.Sheets[workbook.SheetNames[0]];
                    const rows = XLSX.utils.sheet_to_json(sheet);

                    if (rows.length === 0) throw new Error("Data kosong");

                    // Kosongkan area cetak yang lama
                    printArea.innerHTML = '';
                    
                    const CARDS_PER_PAGE = 10;
                    let currentPage = null;
                    let cardCount = 0;

                    rows.forEach((row) => {
                        // Buka lembar A4 baru setiap 10 kartu
                        if (cardCount % CARDS_PER_PAGE === 0) {
                            currentPage = document.createElement('div');
                            currentPage.className = 'a4-page';
                            printArea.appendChild(currentPage);
                        }

                        // Ambil dan olah data kolom (fleksibel besar/kecil huruf nama kolom)
                        const nama = row['Nama'] || row['nama'] || row['NAMA'] || '-';
                        const kelasRaw = row['Kelas'] || row['kelas'] || row['KELAS'] || '';
                        const jurusanTranslated = translateJurusan(kelasRaw);
                        
                        const fotoKey = (row['Foto'] || row['foto'] || row['FOTO'] || '').toString().toLowerCase();
                        
                        const fotoSrc = photoMap[fotoKey] || 'https://placehold.co/220x330/cbd5e1/475569?text=FOTO+KOSONG';
                        const bgSrc = customTemplateUrl || 'https://placehold.co/850x550/e2e8f0/64748b?text=Template+Kosong';

                        // Struktur Kartu Satuan - Gunakan tag img asli (z-index terendah) bukan CSS Background
                        const cardHTML = `
                            <div class="card">
                                <img src="${bgSrc}" class="card-bg" alt="template">
                                <img src="${fotoSrc}" class="card-foto" alt="foto">
                                <div class="card-nama">${nama}</div>
                                <div class="card-jurusan">${jurusanTranslated}</div>
                            </div>
                        `;

                        currentPage.innerHTML += cardHTML;
                        cardCount++;
                    });

                    setStatus(`Berhasil! ${cardCount} kartu siap dicetak.`);
                } catch (err) {
                    console.error(err);
                    setStatus("Gagal memproses data. Pastikan format kolom excel benar.");
                }
            };
            reader.readAsArrayBuffer(excelFile);
        }
    </script>
</body>
</html>
